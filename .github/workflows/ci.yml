name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build service image
        run: docker build -t cinema-stream-service:test .
      - name: Check packaged configuration
        run: >-
          docker run --rm
          -e PROWLARR_API_KEY=fixture-key
          -e QBITTORRENT_USERNAME=someone
          -e QBITTORRENT_PASSWORD=fixture-password
          cinema-stream-service:test --check-config
